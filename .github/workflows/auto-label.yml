# auto-label (REUSABLE) — the factory's entry gate.
# Called by a child repo's thin caller on `issues: opened`. When a COLLABORATOR
# opens an issue, apply `agent:explore` via FACTORY_PAT (so the downstream
# `labeled` event fires). Non-collaborator issues are a clean no-op.
#
# The `github` context here is the CALLER's event, so github.event.issue.* and
# $GITHUB_REPOSITORY resolve to the child repo.
name: auto-label

on:
  workflow_call:
    secrets:
      FACTORY_PAT:
        required: true

permissions:
  contents: read

concurrency:
  group: auto-label-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the issue author is a collaborator
        id: check
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const author = context.payload.issue.user.login;
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner, repo: context.repo.repo, username: author,
            });
            const role = data.role_name || data.permission;
            const enter = ["admin", "maintain", "write", "triage"].includes(role);
            core.info(`author=${author} role=${role} enter=${enter}`);
            core.setOutput("enter", enter ? "true" : "false");

      - name: Apply agent:explore
        if: steps.check.outputs.enter == 'true'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_PAT }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "agent:explore"
